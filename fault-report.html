<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fault report - iTechAssist</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
      <nav>
        <span class="brand">iTechAssist</span>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation menu">☰</button>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="fault-report.html">Report a fault</a>
          <a href="fault-log.html">Fault log</a>
          <a href="login.html">Login</a>
          <a href="signup.html">Sign up</a>
        </div>
        <select class="lang-selector" id="lang-selector" aria-label="Select language" title="Select language">
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="es">Español</option>
                <option value="de">Deutsch</option>
                <option value="pt">Português</option>
                <option value="ar">العربية</option>
                <option value="zh">中文</option>
                <option value="hi">हिन्दी</option>
                <option value="sw">Kiswahili</option>
                <option value="ru">Русский</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
                <option value="sv">Svenska</option>
        </select>  
      </nav>
    </header>

    <main>

    <div class="page-card">

     <div class="page-card-header">
      <h1>Submit a fault report</h1>
      <p>Fill in the details below. The AI will analyse your report and suggest a diagnosis.</p>
     </div>

    <form action="#" method="post" enctype="multipart/form-data">

      <div class="form-grid">

        <div class="form-group">
          <label for="tech-name">Technician name</label>
          <input type="text" id="technician-name" name="technician-name" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
          <label for="tech-id">Technician ID</label>
          <input type="text" id="technician-id" name="technician-id" placeholder="e.g. TECH-0042" required>
        </div>

        <div class="form-group">
          <label for="equipment-id">Equipment ID</label>
          <input type="text" id="equipment-id" name="equipment-id" placeholder="e.g. PUMP-003" required>
        </div>

        <div class="form-group">
          <label for="site-location">Site location</label>
          <input type="text" id="site-location" name="site-location" placeholder="e.g. Lagos — Apapa terminal" required>
        </div>

        <div class="form-group">
          <label for="fault-type">Fault type</label>
          <select id="fault-type" name="fault-type" required>
            <option value="">-- Select fault type --</option>
            <option value="electrical">Electrical</option>
            <option value="mechanical">Mechanical</option>
            <option value="electronic">Electronic and instrumentation</option>
            <option value="hvac">HVAC and refrigeration</option>
            <option value="software">Software and controls</option>
            <option value="structural">Structural and civil</option>
            <option value="biomedical">Biomedical</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="fault-severity">Fault severity</label>
          <select id="fault-severity" name="fault-severity" required>
            <option value="">-- Select severity --</option>
            <option value="critical">Critical — equipment completely down</option>
            <option value="high">High — serious performance loss</option>
            <option value="medium">Medium — partial fault, still running</option>
            <option value="low">Low — minor issue, monitor for now</option>
          </select>
        </div>

      </div>

      <div class="form-group">
        <label for="fault-description">Fault description</label>
        <textarea id="fault-description" name="fault-description" rows="5"
          placeholder="Describe exactly what you observed — sounds, smells, error codes, what happened before the fault..."
          required></textarea>
      </div>

      <div class="form-group">
        <label for="fault-photo">Upload fault photo</label>
        <div class="file-upload-box">
          <input type="file" id="fault-photo" name="fault-photo" accept="image/*" style="display:none;">
          <label for="fault-photo" class="file-upload-label">Choose a photo</label>
        <span class="file-name-display" id="file-name">No photo selected</span>
        </div>
      </div>

      <div class="form-group">
        <label for="sudden">How did the fault occur?</label>
        <div class="radio-group">
          <input type="radio" id="sudden" name="fault-onset" value="sudden">
          <label for="sudden" style="display:inline; font-weight:400;">Sudden failure</label>
        </div>
        <div class="radio-group">
          <input type="radio" id="gradual" name="fault-onset" value="gradual">
          <label for="gradual" style="display:inline; font-weight:400;">Gradual degradation</label>
        </div>
        <div class="radio-group">
          <input type="radio" id="external" name="fault-onset" value="external">
          <label for="external" style="display:inline; font-weight:400;">External damage</label>
        </div>
        <div class="radio-group">
          <input type="radio" id="unknown" name="fault-onset" value="unknown">
          <label for="unknown" style="display:inline; font-weight:400;">Unknown cause</label>
        </div>
      </div>

      <button type="submit">Submit fault report</button>

    </form>

    </div>

    </main>

    <footer>
        <p>iTA - AI powered fault diagnosis for engineers and technicians</p>
        <p>iTechAssist - 2026</p>
    </footer>
  <script src="js/main.js"></script>
</body>
</html>

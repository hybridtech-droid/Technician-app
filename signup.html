<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - iTechAssist</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <nav>
        <span class="brand">iTechAssist</span>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="fault-report.html">Report a fault</a>
        <a href="fault-log.html">Fault log</a>
        <a href="login.html">Login</a>
        <a href="signup.html">Sign up</a>
        <select class="lang-selector" title="Select language">
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="es">Español</option>
                <option value="de">Deutsch</option>
                <option value="pt">Português</option>
                <option value="ar">العربية</option>
                <option value="zh">中文</option>
                <option value="hi">हिन्दी</option>
                <option value="sw">Kiswahili</option>
                <option value="ru">Русский</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
                <option value="sv">Svenska</option>
        </select>
    </nav>
  </header>

<main>
  <div class="auth-card">
    <h1>Create your iTechAssist account</h1>
    <p>Already have an account? <a href="login.html">Log in here</a>.</p>

    <form>

       <label for="full name">Full name:</label>
       <input type="text" id="full-name"
               placeholder="Enter your full name"
               required>

       <label for="phone">Phone number</label>
       <input type="tel" id="phone"
               placeholder="Enter your phone number"
               required>

       <label for="role">Your role</label>
       <select id="role" required>
           <option value="">-- Select your role --</option>
           <option value="field-technician">Field technician</option>
           <option value="engineer">Engineer</option>
           <option value="supervisor">Site supervisor</option>
           <option value="manager">Maintenance manager</option>
           <option value="admin">Administrator</option>
           <option value="technician">Technician</option>
       </select>

       <label for="email">Email:</label>
       <input type="email" id="email"
               placeholder="Enter your email address"
               required>

        <label for="company">Company or organisation or self-employed</label>
        <input type="text" id="company"
               placeholder="Enter your company or organisation name or self-employed status"
               required>

        <label for="password">Create password</label>
        <input type="password" id="password"
               placeholder="Minimum 8 characters, include letters and numbers"
               required>

        <label for="confirm-password">Confirm password</label>
        <input type="password" id="confirm-password"
               placeholder="Re-enter your password"
               required>

        <label class="form-legal">
            <input type="checkbox" id="terms" required>
            <span>I have read and agree to the <a href="terms.html" target="_blank" class="legal-highlight">Terms and Conditions</a> and 
                <a href="privacy.html" target="_blank" class="legal-highlight">Privacy Policy</a>.
            </span>
        </label>

        <label class="form-legal">
            <input type="checkbox" id="disclaimer" required>
            <span>I understad that AI-generated fault diagnoses are suggestions only and must be verified by a qualified engineer before any action is taken.
        </label>

        <button type="submit">Create account</button>

    </form>
   </div>
  </main>

  <footer>
    <p>iTA - AI powered fault diagnosis for engineers and technicians</p>
    <p>iTechAssist - 2026</p>
  </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Tervexa</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <nav>
        <span class="brand">Tervexa</span>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation menu">☰</button>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="fault-report.html">Report a fault</a>
          <a href="fault-log.html">Fault log</a>
          <a href="chat.html">Ask AI</a>
          <a href="login.html">Login</a>
          <a href="signup.html">Sign up</a>
        </div>
        <select class="lang-selector" id="lang-selector" aria-label="Select language" title="Select language">
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="es">Español</option>
                <option value="de">Deutsch</option>
                <option value="pt">Português</option>
                <option value="ar">العربية</option>
                <option value="zh">中文</option>
                <option value="hi">हिन्दी</option>
                <option value="sw">Kiswahili</option>
                <option value="ru">Русский</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
                <option value="sv">Svenska</option>
        </select>
    </nav>
  </header>

<main>
  <div class="auth-card">
    <h1>Create your Tervexa account</h1>
    <p>Already have an account? <a href="login.html">Log in here</a>.</p>

    <form id="signup-form">

       <label for="full-name">Full name:</label>
       <input type="text" id="full-name" name="full-name"
               placeholder="Enter your full name"
               autocomplete="name"
               required>

       <label for="phone">Phone number</label>
       <input type="tel" id="phone" name="phone"
               placeholder="Enter your phone number"
               autocomplete="tel"
               required>

       <label for="role">Your role</label>
      <select id="role" name="role" required>
           <option value="">-- Select your role --</option>
           <option value="technician">Field technician</option>
           <option value="field-application-specialist">Field application specialist</option>
           <option value="engineer">Engineer</option>
           <option value="supervisor">Site supervisor</option>
           <option value="manager">Maintenance manager</option>
           <option value="admin">Administrator</option>
       </select>

       <label for="email">Email</label>
       <input type="email" id="email" name="email"
               placeholder="Enter your email address"
               autocomplete="email"
               required>

        <label for="company">Company or organisation or self-employed</label>
        <input type="text" id="company" name="company"
               placeholder="Enter your company or organisation name or self-employed status"
               autocomplete="organization"
               required>

        <label for="password">Create password</label>
        <input type="password" id="password" name="password"
               placeholder="Minimum 8 characters, include letters and numbers"
               autocomplete="new-password"
               minlength="8"
               required>

        <label for="confirm-password">Confirm password</label>
        <input type="password" id="confirm-password" name="confirm-password"
               placeholder="Re-enter your password"
               autocomplete="new-password"
               minlength="8"
               required>
        <span id="confirm-password-error" class="field-error" hidden></span>

        <label class="form-legal">
            <input type="checkbox" id="terms" name="terms" required>
            <span>I have read and agree to the <a href="terms.html" target="_blank" class="legal-highlight">Terms and Conditions</a> and
                <a href="privacy.html" target="_blank" class="legal-highlight">Privacy Policy</a>.
            </span>
        </label>

        <label class="form-legal">
            <input type="checkbox" id="disclaimer" name="disclaimer" required>
            <span>I understand that AI-generated diagnoses and recommendation are suggestions only and must be verified by a qualified engineer or specialist before any action is taken.</span>
        </label>

        <span id="signup-error" class="field-error" hidden></span>

        <button type="submit" id="signup-submit">Create account</button>

    </form>
   </div>
  </main>

  <footer>
    <p class="footer-line">© 2026 TERVEXA<span class="footer-sep">|</span>Security<span class="footer-sep">|</span>Help<span class="footer-sep">|</span>v1.0.0</p>
  </footer>

<script src="js/main.js"></script>
</body>
</html>

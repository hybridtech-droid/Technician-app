<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - iTechAssist</title>
</head>
<body>

  <header>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="fault-report.html">Report a fault</a>
        <a href="fault-log.html">Fault log</a>
        <a href="login.html">Login</a>
        <a href="signup.html">Sign up</a>
    </nav>
  </header>

<main>

    <h1>Create your iTechAssist account</h1>
    <p>Already have an account? <a href="login.html">Log in here</a>.</p>

    <form>

       <label for="full name">Full name:</label>
       <input type="text" id="full-name"
               placeholder="Enter your full name"
               required>

       <label for="phone">Phone number</label>
       <input type="tel" id="phone"
               placeholder="Enter your phone number"
               required>

       <label for="role">Your role</label>
       <select id="role" required>
           <option value="">-- Select your role --</option>
           <option value="field-technician">Field technician</option>
           <option value="engineer">Engineer</option>
           <option value="supervisor">Site supervisor</option>
           <option value="manager">Maintenance manager</option>
           <option value="admin">Administrator</option>
           <option value="technician">Technician</option>
       </select>

       <label for="email">Email:</label>
       <input type="email" id="email"
               placeholder="Enter your email address"
               required>

        <label for="company">Company or organisation or self-employed</label>
        <input type="text" id="company"
               placeholder="Enter your company or organisation name or self-employed status"
               required>

        <label for="password">Create password</label>
        <input type="password" id="password"
               placeholder="Minimum 8 characters, include letters and numbers"
               required>

        <label for="confirm-password">Confirm password</label>
        <input type="password" id="confirm-password"
               placeholder="Re-enter your password"
               required>

        <label>
            <input type="checkbox" id="terms" required>
            I have read and agree to the <a href="terms.html" target="_blank">Terms and Conditions</a> and <a href="privacy.html" target="_blank">Privacy Policy</a>.
        </label>

        <label>
            <input type="checkbox" id="disclaimer" required>
            I understad that AI-generated fault diagnoses are suggestions only and must be verified by a qualified engineer before any action is taken.
        </label>

        <button type="submit">Create account</button>

    </form>

  </main>

  <footer>
    <p>iTA - AI powered fault diagnosis for engineers and technicians</p>
    <p>iTechAssist - 2026</p>
  </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tervexa</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
    <nav>
        <span class="brand">Tervexa</span>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation menu">☰</button>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="fault-report.html">Report a fault</a>
          <a href="fault-log.html">Fault log</a>
          <a href="chat.html">Ask AI</a>
          <a href="login.html">Login</a>
          <a href="signup.html">Sign up</a>
        </div>
        <select class="lang-selector" id="lang-selector" aria-label="Select language" title="Select language">
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="es">Español</option>
                <option value="de">Deutsch</option>
                <option value="pt">Português</option>
                <option value="ar">العربية</option>
                <option value="zh">中文</option>
                <option value="hi">हिन्दी</option>
                <option value="sw">Kiswahili</option>
                <option value="ru">Русский</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
                <option value="sv">Svenska</option>
        </select>
    </nav>
</header>

    <main>
     <div class="auth-card">
      <h1>Log in to Tervexa</h1>
      <p>Do not have an account yet?>
        <a href="signup.html">Sign up here</a>
      </p>
      <form>

        <label for="email">Email address</label>
        <input type="email" id="email" name="email" autocomplete="username"
               placeholder="Enter your email address" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password"
               placeholder="Enter your password" required>

        <label>
          <input type="checkbox" id="remember-me" name="remember-me" value="yes">
          Remember me on this device
        </label>

        <button type="submit">Log in</button>

    </form>
   </div>

    <p>Forgot your password?
        <a href="reset-password.html">Reset password</a>
    </p>

  </main>

  <footer>
    <p class="footer-line">© 2026 TERVEXA<span class="footer-sep">|</span><a href="privacy.html">Privacy</a><span class="footer-sep">|</span><a href="terms.html">Terms</a><span class="footer-sep">|</span>Security<span class="footer-sep">|</span>Help<span class="footer-sep">|</span>v1.0.0</p>
  </footer>

<script src="js/main.js"></script>
</body>
</html>

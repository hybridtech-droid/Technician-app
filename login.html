<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tervexa</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
    <nav>
        <span class="brand">Tervexa</span>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation menu">☰</button>
        <div class="nav-links">
          <a href="index.html" data-i18n="nav.home">Home</a>
          <a href="about.html" data-i18n="nav.about">About</a>
          <a href="fault-report.html" data-i18n="nav.reportFault">Report a fault</a>
          <a href="fault-log.html" data-i18n="nav.faultLog">Fault log</a>
          <a href="chat.html" data-i18n="nav.askAI">Ask AI</a>
          <a href="login.html" data-i18n="nav.login">Login</a>
          <a href="signup.html" data-i18n="nav.signup">Sign up</a>
        </div>
        <select class="lang-selector" id="lang-selector" aria-label="Select language" title="Select language">
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="es">Español</option>
                <option value="de">Deutsch</option>
                <option value="pt">Português</option>
                <option value="ar">العربية</option>
                <option value="zh">中文</option>
                <option value="hi">हिन्दी</option>
                <option value="sw">Kiswahili</option>
                <option value="ru">Русский</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
                <option value="sv">Svenska</option>
        </select>
    </nav>
</header>

    <main>
     <div class="auth-card">
      <h1 data-i18n="login.heading">Log in to Tervexa</h1>
      <p><span data-i18n="auth.dontHaveAccount">Do not have an account yet?</span>
        <a href="signup.html" data-i18n="auth.signUpHere">Sign up here</a>
      </p>
      <form id="login-form">

        <label for="email" data-i18n="login.emailLabel">Email address</label>
        <input type="email" id="email" name="email" autocomplete="username"
               placeholder="Enter your email address" data-i18n-placeholder="login.emailPlaceholder" required>

        <label for="password" data-i18n="login.passwordLabel">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password"
               placeholder="Enter your password" data-i18n-placeholder="login.passwordPlaceholder" required>

        <label>
          <input type="checkbox" id="remember-me" name="remember-me" value="yes">
          <span data-i18n="login.rememberMe">Remember me on this device</span>
        </label>

        <span id="login-error" class="field-error" hidden></span>

        <button type="submit" id="login-submit" data-i18n="login.submit">Log in</button>

    </form>
   </div>

    <p><span data-i18n="auth.forgotPassword">Forgot your password?</span>
        <a href="reset-password.html" data-i18n="auth.resetPasswordLink">Reset password</a>
    </p>

  </main>

  <footer>
    <p class="footer-line">© 2026 TERVEXA<span class="footer-sep">|</span><a href="privacy.html" data-i18n="footer.privacy">Privacy</a><span class="footer-sep">|</span><a href="terms.html" data-i18n="footer.terms">Terms</a><span class="footer-sep">|</span><span data-i18n="footer.security">Security</span><span class="footer-sep">|</span><span data-i18n="footer.help">Help</span><span class="footer-sep">|</span>v1.0.0</p>
  </footer>

<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
</body>
</html>

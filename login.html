<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - iTechAssist</title>
</head>
<body>

    <header>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="fault-report.html">Report a fault</a>
        <a href="fault-log.html">Fault log</a>
        <a href="login.html">Login</a>
        <a href="signup.html">Sign up</a>
      </nav>
    </header>

    <main>

      <h1>Log in to iTechAssist</h1>
      <p>Do not have an account yet?</p>
        <a href="signup.html">Sign up here</a>
      </p>
      
      <form>

        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>

        <label for="email">Email address</label>
        <input type="email" id="email" 
               placeholder="Enter your email address" required>

        <label for="password">Password</label>
        <input type="password" id="password"
               placeholder="Enter your password" required>


        <label>
          <input type="checkbox" id="remember-me">
          Remember me on this device
        </label>

        <button type="submit">Log in</button>

    </form>

    <p>Forget your password?
        <a href="reset-password.html">Reset password</a>
    </p>

  </main>

  <footer>
    <p>iTA - AI powered fault diagnosis for engineers and technicians</p>
    <p>iTechAssist - 2026</p>
  </footer>

</body>
</html>
